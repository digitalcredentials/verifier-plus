# Databases for the store tests: `npm run test:stores` runs the credential
# store contract suite against memory, MongoDB and DynamoDB Local.
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:stores
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["8000:8000"]
